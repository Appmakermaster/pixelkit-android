name: Build PixelKit Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PixelKit ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_file = sys.argv[1]
          destination = Path("project")

          with zipfile.ZipFile(zip_file, "r") as z:
              for info in z.infolist():
                  name = info.filename.lstrip("/")

                  if not name or name.endswith("/"):
                      continue

                  path = Path(name)

                  if ".." in path.parts:
                      print(f"Skipping unsafe path: {name}")
                      continue

                  target = destination / path
                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(info) as source:
                      with open(target, "wb") as output:
                          output.write(source.read())

          print("ZIP extracted successfully.")
          PY

          echo "Extracted files:"
          find project -maxdepth 2 -type f | head -50

      - name: Find project root
        run: |
          if [ -f project/package.json ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            DIR=$(find project -name package.json -type f -print -quit | xargs -r dirname)

            if [ -z "$DIR" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init PixelKit com.pixelkit.app --web-dir=dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
