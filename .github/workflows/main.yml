name: Build PixelKit Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract ZIP safely, including ZIPs that contain absolute paths
      - name: Extract PixelKit ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p project

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = sys.argv[1]
          output = Path("project").resolve()

          with zipfile.ZipFile(zip_path, "r") as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")

                  # Remove leading / so absolute paths become relative
                  name = name.lstrip("/")

                  # Prevent ../ paths from escaping project/
                  parts = [p for p in name.split("/") if p not in ("", ".")]

                  if any(p == ".." for p in parts):
                      print(f"Skipping unsafe path: {info.filename}")
                      continue

                  target = output.joinpath(*parts)

                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, open(target, "wb") as dst:
                          dst.write(src.read())

          print("ZIP extracted successfully.")
          PY

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find project root
        shell: bash
        run: |
          set -e

          if [ -f "project/package.json" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/project"
          else
            PACKAGE_FILE=$(find project -name package.json -type f -print -quit)

            if [ -z "$PACKAGE_FILE" ]; then
              echo "ERROR: package.json was not found."
              echo "Extracted files:"
              find project -maxdepth 4 -type f
              exit 1
            fi

            PROJECT_DIR="$GITHUB_WORKSPACE/$(dirname "$PACKAGE_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init PixelKit com.pixelkit.app --web-dir=dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "APK files:"
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
