name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 21
      # ==========================================

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ==========================================
      # 3. VERIFY JAVA
      # ==========================================

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version


      # ==========================================
      # 4. NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: project/package-lock.json


      # ==========================================
      # 5. INSTALL WEB DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        working-directory: project
        run: npm ci


      # ==========================================
      # 6. BUILD REACT WEB APPLICATION
      # ==========================================

      - name: Build web application
        working-directory: project
        run: npm run build


      # ==========================================
      # 7. INSTALL CAPACITOR
      # ==========================================

      - name: Install Capacitor
        working-directory: project
        run: npm install


      # ==========================================
      # 8. SYNC CAPACITOR
      # ==========================================

      - name: Sync Capacitor Android
        working-directory: project
        run: npx cap sync android


      # ==========================================
      # 9. VERIFY ANDROID PROJECT
      # ==========================================

      - name: Verify Android project
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew --version


      # ==========================================
      # 10. BUILD DEBUG APK
      # ==========================================

      - name: Build Debug APK
        working-directory: project/android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon


      # ==========================================
      # 11. FIND APK
      # ==========================================

      - name: Find APK
        working-directory: project/android
        run: |
          echo "Searching for APK..."
          find app/build/outputs -type f -name "*.apk" -print


      # ==========================================
      # 12. UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-APK
          path: project/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
