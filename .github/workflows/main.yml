name: Build PixelKit Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract PixelKit ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          output = Path("project").resolve()

          with zipfile.ZipFile(zip_path, "r") as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/").lstrip("/")

                  parts = [
                      p for p in name.split("/")
                      if p not in ("", ".")
                  ]

                  if ".." in parts:
                      continue

                  target = (output / Path(*parts)).resolve()

                  try:
                      target.relative_to(output)
                  except ValueError:
                      continue

                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, open(target, "wb") as dst:
                          dst.write(src.read())

          print("ZIP extracted successfully.")
          PY

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find project directory
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find project -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"
          cat "$PROJECT_DIR/package.json"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          npm run build

      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init PixelKit com.pixelkit.app --web-dir=dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "APK files:"
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
