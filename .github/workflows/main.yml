name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept Android licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 6. Find PixelKit ZIP
      - name: Find PixelKit ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 7. Extract PixelKit ZIP
      - name: Extract PixelKit ZIP
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          output = Path("project").resolve()

          with zipfile.ZipFile(zip_path, "r") as z:
              for info in z.infolist():

                  name = info.filename.replace("\\", "/").lstrip("/")

                  parts = [
                      p for p in name.split("/")
                      if p not in ("", ".")
                  ]

                  if ".." in parts:
                      continue

                  if not parts:
                      continue

                  target = (output / Path(*parts)).resolve()

                  try:
                      target.relative_to(output)
                  except ValueError:
                      continue

                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)

                      with z.open(info) as src:
                          with open(target, "wb") as dst:
                              dst.write(src.read())

          print("ZIP extracted successfully.")
          PY

          echo "Extracted files:"
          find project -maxdepth 5 -type f | head -200

      # 8. Find React project
      - name: Find project directory
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find project -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # 9. Show package.json
      - name: Show package.json
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat package.json

      # 10. Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm config set fund false
          npm config set audit false

          if [ -f package-lock.json ]; then
            npm ci --include=dev
          else
            npm install --include=dev
          fi

      # 11. Ensure react-scripts exists
      - name: Install react-scripts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -x node_modules/.bin/react-scripts ]; then
            echo "react-scripts is missing."
            echo "Installing react-scripts..."

            npm install --save-dev react-scripts@5.0.1
          fi

          echo "Checking react-scripts..."
          ./node_modules/.bin/react-scripts --version

      # 12. Install Capacitor
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # 13. Build React application
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building React application..."

          npm run build

          echo "Checking React build output..."

          if [ ! -d build ]; then
            echo "ERROR: React build directory was not created."
            echo "Project contents:"
            find . -maxdepth 3 -type d
            exit 1
          fi

          echo "React build completed successfully."
          find build -maxdepth 2 -type f | head -100

      # 14. Configure Capacitor
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          # Create Capacitor config if it doesn't exist
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then

            echo "Creating Capacitor configuration..."

            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pixelkit.app",
            "appName": "PixelKit",
            "webDir": "build"
          }
          EOF

          fi

          # If JSON config exists, make sure it uses CRA's build folder
          if [ -f capacitor.config.json ]; then

            python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("capacitor.config.json")

          try:
              data = json.loads(path.read_text())
          except Exception:
              data = {}

          data["appId"] = data.get("appId", "com.pixelkit.app")
          data["appName"] = data.get("appName", "PixelKit")
          data["webDir"] = "build"

          path.write_text(
              json.dumps(data, indent=2) + "\n"
          )

          print("Updated capacitor.config.json")
          PY

          fi

          echo "Capacitor configuration:"
          if [ -f capacitor.config.json ]; then
            cat capacitor.config.json
          fi

          # Add Android platform
          if [ ! -d android ]; then
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

          # Copy web files
          echo "Copying web files to Android..."
          npx cap copy android

      # 15. Verify Android project
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper not found."
            find android -maxdepth 3 -type f | head -100
            exit 1
          fi

          if [ ! -d android/app ]; then
            echo "ERROR: Android app directory not found."
            exit 1
          fi

          echo "Android project verified."

      # 16. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 17. Find APK
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find android \
            -type f \
            -name "*.apk" \
            -print

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
