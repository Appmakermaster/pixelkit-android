name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Find PixelKit ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract PixelKit ZIP
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          output = Path("project").resolve()

          with zipfile.ZipFile(zip_path, "r") as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/").lstrip("/")

                  parts = [
                      p for p in name.split("/")
                      if p not in ("", ".")
                  ]

                  if ".." in parts:
                      continue

                  target = (output / Path(*parts)).resolve()

                  try:
                      target.relative_to(output)
                  except ValueError:
                      continue

                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)

                      with z.open(info) as src:
                          with open(target, "wb") as dst:
                              dst.write(src.read())

          print("ZIP extracted successfully.")
          PY

      - name: Find project
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find project -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found."
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Show package.json
        working-directory: ${{ env.PROJECT_DIR }}
        run: cat package.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm run build

      - name: Detect web output
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -d "dist" ]; then
            echo "WEB_DIR=dist" >> "$GITHUB_ENV"
            echo "Using dist/"
          elif [ -d "build" ]; then
            echo "WEB_DIR=build" >> "$GITHUB_ENV"
            echo "Using build/"
          else
            echo "ERROR: No dist/ or build/ directory found."
            echo "Project contents:"
            find . -maxdepth 2 -type d
            exit 1
          fi

      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Web directory: $WEB_DIR"

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init PixelKit com.pixelkit.app --web-dir="$WEB_DIR"
          fi

          if [ ! -d android ] || [ ! -f android/gradlew ]; then
            echo "Android project missing or incomplete."
            echo "Creating Android project..."

            rm -rf android
            npx cap add android
          fi

          npx cap copy android

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Gradle wrapper was not created."
            find android -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo "Node:"
          node --version

          echo "Gradle wrapper:"
          ls -la gradlew

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "APK files:"
          find android -type f -name "*.apk" -print

          APK_COUNT=$(find android -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
