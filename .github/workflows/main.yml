name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # SHOW PROJECT STRUCTURE
      # =========================================

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Important files:"
          find . -maxdepth 3 -type f \
            \( -name "package.json" \
            -o -name "package-lock.json" \
            -o -name "capacitor.config.*" \
            -o -name "settings.gradle" \
            -o -name "build.gradle" \
            -o -name "gradlew" \) \
            -print


      # =========================================
      # NODE.JS
      # =========================================

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20


      # =========================================
      # JAVA 21
      # =========================================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =========================================
      # CHECK JAVA
      # =========================================

      - name: Check Java version
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version


      # =========================================
      # CHECK NODE
      # =========================================

      - name: Check Node and npm
        run: |
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version


      # =========================================
      # VERIFY PACKAGE.JSON
      # =========================================

      - name: Verify web project
        run: |
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json was not found in the repository root."
            echo ""
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "package.json found."
          echo ""
          cat package.json


      # =========================================
      # INSTALL DEPENDENCIES
      # =========================================

      - name: Install web dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found."
            npm ci
          else
            echo "No package-lock.json found."
            npm install
          fi


      # =========================================
      # BUILD WEB APPLICATION
      # =========================================

      - name: Build web application
        run: |
          npm run build


      # =========================================
      # CHECK CAPACITOR
      # =========================================

      - name: Check Capacitor
        run: |
          npx cap --version


      # =========================================
      # CHECK CAPACITOR CONFIG
      # =========================================

      - name: Check Capacitor configuration
        run: |
          echo "Looking for Capacitor configuration..."

          if [ -f "capacitor.config.ts" ]; then
            echo "Found capacitor.config.ts"
          elif [ -f "capacitor.config.json" ]; then
            echo "Found capacitor.config.json"
          elif [ -f "capacitor.config.js" ]; then
            echo "Found capacitor.config.js"
          else
            echo "ERROR: No Capacitor configuration found."
            exit 1
          fi


      # =========================================
      # SYNC CAPACITOR
      # =========================================

      - name: Sync Capacitor Android
        run: |
          npx cap sync android


      # =========================================
      # CHECK ANDROID DIRECTORY
      # =========================================

      - name: Check Android project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android directory was not found."
            echo ""
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          echo "Android directory found."
          echo ""
          ls -la android


      # =========================================
      # CHECK GRADLE WRAPPER
      # =========================================

      - name: Check Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: android/gradlew was not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version


      # =========================================
      # CLEAN ANDROID
      # =========================================

      - name: Clean Android project
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean


      # =========================================
      # BUILD DEBUG APK
      # =========================================

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      # =========================================
      # FIND APK
      # =========================================

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
