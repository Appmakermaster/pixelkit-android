name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # NODE.JS
      # =========================================

      # IMPORTANT:
      # Do NOT use "cache: npm" here.
      # Your previous build failed because of the npm cache path.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20


      # =========================================
      # JAVA 21
      # =========================================

      # Capacitor Android is compiling with Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =========================================
      # VERIFY JAVA
      # =========================================

      - name: Check Java version
        run: |
          java -version
          javac -version


      # =========================================
      # VERIFY NODE
      # =========================================

      - name: Check Node and npm
        run: |
          node --version
          npm --version


      # =========================================
      # INSTALL WEB DEPENDENCIES
      # =========================================

      # Uses npm ci when package-lock.json exists.
      # Falls back to npm install if there is no lock file.
      - name: Install web dependencies
        working-directory: project
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # =========================================
      # BUILD WEB APPLICATION
      # =========================================

      - name: Build web application
        working-directory: project
        run: npm run build


      # =========================================
      # CHECK CAPACITOR
      # =========================================

      - name: Check Capacitor
        working-directory: project
        run: |
          npx cap --version


      # =========================================
      # SYNC CAPACITOR ANDROID
      # =========================================

      - name: Sync Capacitor Android
        working-directory: project
        run: |
          npx cap sync android


      # =========================================
      # VERIFY ANDROID PROJECT
      # =========================================

      - name: Verify Android project
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew --version


      # =========================================
      # CLEAN ANDROID BUILD
      # =========================================

      - name: Clean Android project
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew clean


      # =========================================
      # BUILD DEBUG APK
      # =========================================

      - name: Build Debug APK
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      # =========================================
      # FIND APK
      # =========================================

      - name: Find APK
        working-directory: project/android
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
