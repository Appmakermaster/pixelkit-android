name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. CHECKOUT REPOSITORY
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # 2. SHOW REPOSITORY
      # =========================================

      - name: Show repository contents
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 1 -type f -name "*.zip" -print


      # =========================================
      # 3. EXTRACT PROJECT ZIP
      # =========================================

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project file was found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted-project

          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo ""
          echo "Extracted project:"
          find extracted-project -maxdepth 3 -type f | head -n 200


      # =========================================
      # 4. FIND WEB PROJECT
      # =========================================

      - name: Find web project
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find extracted-project \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            echo ""
            echo "Extracted files:"
            find extracted-project -maxdepth 5 -type f | head -n 300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json:"
          echo "$PACKAGE_JSON"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================
      # 5. SHOW PROJECT
      # =========================================

      - name: Show web project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -lah "$PROJECT_DIR"


      # =========================================
      # 6. SET UP NODE.JS
      # =========================================

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20


      # =========================================
      # 7. SET UP JAVA 21
      # =========================================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================
      # 8. CHECK JAVA
      # =========================================

      - name: Check Java version
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version


      # =========================================
      # 9. CHECK NODE
      # =========================================

      - name: Check Node and npm
        run: |
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version


      # =========================================
      # 10. VERIFY PACKAGE
      # =========================================

      - name: Verify package.json
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "package.json found."

          echo ""
          echo "Package:"
          cat "$PROJECT_DIR/package.json"


      # =========================================
      # 11. INSTALL WEB DEPENDENCIES
      # =========================================

      - name: Install web dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found."
            npm ci
          else
            echo "package-lock.json not found."
            echo "Running npm install."
            npm install
          fi


      # =========================================
      # 12. BUILD WEB APPLICATION
      # =========================================

      - name: Build web application
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm run build


      # =========================================
      # 13. CHECK CAPACITOR
      # =========================================

      - name: Check Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap --version


      # =========================================
      # 14. CHECK CAPACITOR CONFIG
      # =========================================

      - name: Check Capacitor configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Looking for Capacitor configuration..."

          if [ -f "capacitor.config.ts" ]; then
            echo "Found capacitor.config.ts"

          elif [ -f "capacitor.config.js" ]; then
            echo "Found capacitor.config.js"

          elif [ -f "capacitor.config.json" ]; then
            echo "Found capacitor.config.json"

          else
            echo "ERROR: Capacitor configuration was not found."
            exit 1
          fi


      # =========================================
      # 15. CHECK ANDROID
      # =========================================

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -d "android" ]; then
            echo "Android directory already exists."
          else
            echo "Android directory does not exist."
            echo "Attempting to create Android project."

            npx cap add android
          fi

          echo ""
          echo "Android directory:"
          ls -lah android


      # =========================================
      # 16. SYNC CAPACITOR
      # =========================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android


      # =========================================
      # 17. CHECK GRADLE
      # =========================================

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version


      # =========================================
      # 18. CLEAN ANDROID
      # =========================================

      - name: Clean Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x ./gradlew

          ./gradlew clean


      # =========================================
      # 19. BUILD DEBUG APK
      # =========================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace


      # =========================================
      # 20. FIND APK
      # =========================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR/android/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print


      # =========================================
      # 21. UPLOAD APK
      # =========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
