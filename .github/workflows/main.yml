name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. SETUP NODE.JS
      # =========================================================

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: project/package-lock.json


      # =========================================================
      # 3. SETUP JAVA 21
      # =========================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # =========================================================
      # 4. VERIFY JAVA
      # =========================================================

      - name: Check Java version
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version


      # =========================================================
      # 5. CHECK NODE / NPM
      # =========================================================

      - name: Check Node and npm
        run: |
          node --version
          npm --version


      # =========================================================
      # 6. INSTALL WEB APP DEPENDENCIES
      # =========================================================

      - name: Install web dependencies
        working-directory: project
        run: |
          npm ci


      # =========================================================
      # 7. BUILD REACT WEB APPLICATION
      # =========================================================

      - name: Build web application
        working-directory: project
        run: |
          npm run build


      # =========================================================
      # 8. INSTALL CAPACITOR CLI
      # =========================================================

      - name: Install Capacitor CLI
        working-directory: project
        run: |
          npm install @capacitor/cli


      # =========================================================
      # 9. VERIFY CAPACITOR
      # =========================================================

      - name: Check Capacitor
        working-directory: project
        run: |
          npx cap --version


      # =========================================================
      # 10. SYNC WEB APP WITH ANDROID
      # =========================================================

      - name: Sync Capacitor Android
        working-directory: project
        run: |
          npx cap sync android


      # =========================================================
      # 11. VERIFY ANDROID PROJECT
      # =========================================================

      - name: Verify Android project
        working-directory: project
        run: |
          test -d android
          test -f android/gradlew
          chmod +x android/gradlew

          echo "Android project found."
          echo "Gradle version:"
          cd android
          ./gradlew --version


      # =========================================================
      # 12. VERIFY JAVA USED BY GRADLE
      # =========================================================

      - name: Verify Gradle Java environment
        working-directory: project/android
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version


      # =========================================================
      # 13. BUILD DEBUG APK
      # =========================================================

      - name: Build Debug APK
        working-directory: project/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace


      # =========================================================
      # 14. FIND APK
      # =========================================================

      - name: Find APK
        working-directory: project/android
        run: |
          echo "Searching for APK files..."
          find app/build/outputs/apk -type f -name "*.apk" -print

          test -n "$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

          echo "APK successfully created."


      # =========================================================
      # 15. COPY APK TO SIMPLE LOCATION
      # =========================================================

      - name: Prepare APK
        working-directory: project
        run: |
          mkdir -p release

          APK_PATH=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          test -n "$APK_PATH"

          cp "$APK_PATH" release/PixelKit-debug.apk

          echo "APK prepared:"
          ls -lh release/PixelKit-debug.apk


      # =========================================================
      # 16. UPLOAD APK
      # =========================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-Android-Debug
          path: project/release/PixelKit-debug.apk
          if-no-files-found: error
          retention-days: 7
