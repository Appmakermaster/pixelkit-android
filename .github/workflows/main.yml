name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Find and extract ZIP
      - name: Extract PixelKit ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          output = Path("project").resolve()

          with zipfile.ZipFile(zip_path, "r") as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/").lstrip("/")

                  parts = [
                      p for p in name.split("/")
                      if p not in ("", ".")
                  ]

                  if ".." in parts:
                      continue

                  target = (output / Path(*parts)).resolve()

                  try:
                      target.relative_to(output)
                  except ValueError:
                      continue

                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)

                      with z.open(info) as src:
                          with open(target, "wb") as dst:
                              dst.write(src.read())

          print("ZIP extracted successfully.")
          PY

          echo "Extracted files:"
          find project -maxdepth 5 -type f | head -200

      # 3. Locate package.json
      - name: Find project directory
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find project -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            echo "Project contents:"
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "package.json:"
          cat "$PROJECT_DIR/package.json"

      # 4. Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # 5. Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 6. Install Capacitor
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 7. Build web application
      - name: Build React app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          npm run build

      # 8. Configure Capacitor
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init PixelKit com.pixelkit.app --web-dir=dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap copy android

      # 9. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 10. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 11. Accept licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 12. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

      # 13. Find APK
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Generated APK files:"
          find android -type f -name "*.apk" -print

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
