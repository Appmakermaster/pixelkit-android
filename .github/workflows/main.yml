name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Android APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"
      NODE_OPTIONS: "--openssl-legacy-provider"

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Set up Node.js
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # =========================================================
      # 3. Set up Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =========================================================
      # 4. Show repository contents
      # =========================================================
      - name: Show repository contents
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current directory:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 3 -type f -print | sort

      # =========================================================
      # 5. Find project ZIP
      # =========================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo
          echo "Using project ZIP:"
          echo "$ZIP_FILE"

      # =========================================================
      # 6. Extract project
      # =========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo
          echo "Extracted project files:"
          find project -maxdepth 4 -type f -print | sort

      # =========================================================
      # 7. Locate package.json
      # =========================================================
      - name: Locate web project
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_JSON="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              | head -n 1
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo
          echo "package.json:"
          cat "$PACKAGE_JSON"

      # =========================================================
      # 8. Check PixelKit icon
      # =========================================================
      - name: Check PixelKit icon
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for PixelKit icon..."

          if [ -f "assets/icon.png" ]; then
            echo
            echo "FOUND: assets/icon.png"
            file assets/icon.png
            ls -lh assets/icon.png

          else
            echo
            echo "ERROR: assets/icon.png was not found."
            echo
            echo "Available image files:"
            find . \
              -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
              -not -path '*/node_modules/*' \
              -print \
              | sort

            exit 1
          fi

      # =========================================================
      # 9. Install web dependencies
      # =========================================================
      - name: Install web dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install

      # =========================================================
      # 10. Install Capacitor
      # =========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # =========================================================
      # 11. Install Capacitor Assets
      # =========================================================
      - name: Install Capacitor Assets
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install --save-dev @capacitor/assets

      # =========================================================
      # 12. Check Node / npm / Capacitor
      # =========================================================
      - name: Check Node npm and Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Capacitor:"
          npx cap --version

          echo
          echo "Capacitor packages:"
          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets \
            --depth=0

      # =========================================================
      # 13. Build web application
      # =========================================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          CI: "false"
        run: |
          set -euxo pipefail

          npm run build

      # =========================================================
      # 14. Determine web directory
      # =========================================================
      - name: Determine web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "build" ]; then
            WEB_DIR="build"

          elif [ -d "dist" ]; then
            WEB_DIR="dist"

          elif [ -d "www" ]; then
            WEB_DIR="www"

          else
            echo "ERROR: No build directory found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo
          echo "Using web directory:"
          echo "$WEB_DIR"

      # =========================================================
      # 15. Create Capacitor configuration
      # =========================================================
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}"
          }
          EOF

          echo
          echo "Capacitor configuration:"
          cat capacitor.config.json

      # =========================================================
      # 16. Create Android project
      # =========================================================
      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            npx cap add android
          fi

      # =========================================================
      # 17. Generate PixelKit Android icon
      # =========================================================
      - name: Generate PixelKit Android icon
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "assets/icon.png" ]; then
            echo "ERROR: assets/icon.png not found."
            exit 1
          fi

          echo "Generating Android launcher icons from:"
          echo "assets/icon.png"

          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#ffffff" \
            --iconBackgroundColorDark "#ffffff"

      # =========================================================
      # 18. Sync Capacitor Android
      # =========================================================
      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npx cap sync android

      # =========================================================
      # 19. Verify Android project
      # =========================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          echo
          echo "Android project created successfully."

          echo
          echo "Checking generated launcher icons:"

          find android/app/src/main/res \
            -type f \
            \( -iname '*launcher*' -o -iname '*icon*' \) \
            -print \
            | sort

      # =========================================================
      # 20. Gradle environment
      # =========================================================
      - name: Check Gradle environment
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version

      # =========================================================
      # 21. Clean Android project
      # =========================================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew clean

      # =========================================================
      # 22. Build Debug APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      # =========================================================
      # 23. Find APK
      # =========================================================
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find android \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "APK found:"
          echo "$APK"

      # =========================================================
      # 24. Upload APK
      # =========================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error

      # =========================================================
      # 25. Complete
      # =========================================================
      - name: Build complete
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "   PIXELKIT APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo
          echo "App ID:"
          echo "${APP_ID}"
          echo
          echo "App Name:"
          echo "${APP_NAME}"
          echo
          echo "Artifact:"
          echo "PixelKit-debug-apk"
          echo
          echo "PixelKit icon:"
          echo "Generated from assets/icon.png"
