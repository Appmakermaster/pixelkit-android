name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Android APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Node.js
      # ---------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      # ---------------------------------------------------------
      # 3. Set up Java
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ---------------------------------------------------------
      # 4. Show repository contents
      # ---------------------------------------------------------
      - name: Show repository contents
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository:"
          pwd
          echo

          echo "Files:"
          find . -maxdepth 2 -type f -print | sort

      # ---------------------------------------------------------
      # 5. Find and extract the uploaded ZIP
      # ---------------------------------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo
          echo "Extracted files:"
          find project -maxdepth 3 -type f -print | sort | head -300

      # ---------------------------------------------------------
      # 6. Locate package.json
      # ---------------------------------------------------------
      - name: Locate web project
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_JSON="$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo
          echo "package.json:"
          cat "$PACKAGE_JSON"

      # ---------------------------------------------------------
      # 7. Install existing web dependencies
      # ---------------------------------------------------------
      - name: Install web dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ---------------------------------------------------------
      # 8. Install Capacitor
      # ---------------------------------------------------------
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # ---------------------------------------------------------
      # 9. Check Capacitor installation
      # ---------------------------------------------------------
      - name: Check Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Capacitor:"
          npx cap --version

          echo
          echo "Installed Capacitor packages:"
          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --depth=0

      # ---------------------------------------------------------
      # 10. Build web application
      # ---------------------------------------------------------
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm run build

      # ---------------------------------------------------------
      # 11. Determine web directory
      # ---------------------------------------------------------
      - name: Determine web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "dist" ]; then
            WEB_DIR="dist"

          elif [ -d "build" ]; then
            WEB_DIR="build"

          elif [ -d "www" ]; then
            WEB_DIR="www"

          else
            echo "ERROR: Could not find web build directory."
            echo
            echo "Directories:"
            find . -maxdepth 2 -type d \
              -not -path './node_modules*' \
              -not -path './android*' \
              | sort

            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "Web directory: $WEB_DIR"

          echo
          echo "Web files:"
          find "$WEB_DIR" -maxdepth 2 -type f -print | sort | head -200

      # ---------------------------------------------------------
      # 12. Create Capacitor configuration
      # ---------------------------------------------------------
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}",
            "bundledWebRuntime": false
          }
          EOF

          echo "capacitor.config.json:"
          cat capacitor.config.json

      # ---------------------------------------------------------
      # 13. Add Android platform
      # ---------------------------------------------------------
      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            npx cap add android
          fi

      # ---------------------------------------------------------
      # 14. Sync web application into Android
      # ---------------------------------------------------------
      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npx cap sync android

      # ---------------------------------------------------------
      # 15. Verify Android project
      # ---------------------------------------------------------
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "android" ]; then
            echo "ERROR: Android directory was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not found."
            exit 1
          fi

          echo "Android project:"
          find android -maxdepth 2 -type f -print | sort | head -200

      # ---------------------------------------------------------
      # 16. Check Java and Gradle
      # ---------------------------------------------------------
      - name: Check Gradle environment
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          java -version

          chmod +x gradlew

          ./gradlew --version

      # ---------------------------------------------------------
      # 17. Clean Android project
      # ---------------------------------------------------------
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew clean

      # ---------------------------------------------------------
      # 18. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------
      # 19. Find APK
      # ---------------------------------------------------------
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for APK..."

          find android -type f -name '*.apk' -print

          APK="$(find android -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Found APK:"
          echo "$APK"

      # ---------------------------------------------------------
      # 20. Upload APK
      # ---------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error

      # ---------------------------------------------------------
      # 21. Build complete
      # ---------------------------------------------------------
      - name: Build complete
        shell: bash
        run: |
          echo "========================================="
          echo "        BUILD COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "APK artifact: PixelKit-debug-apk"
