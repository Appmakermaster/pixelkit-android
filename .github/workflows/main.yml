name: Build PixelKit Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================

      - name: Show repository contents
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 3 -type f -print | sort


      # ============================================================
      # 3. FIND PROJECT ZIP
      # ============================================================

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in repository root."
            echo
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. EXTRACT PROJECT SAFELY
      #
      # This avoids:
      # "warning: stripped absolute path spec from /src/..."
      #
      # It also protects against ../ path traversal.
      # ============================================================

      - name: Extract project
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.zip_file }}
        run: |
          set -e

          rm -rf project
          mkdir -p project

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          destination = Path("project").resolve()

          print("ZIP:", zip_path)
          print("Destination:", destination)

          with zipfile.ZipFile(zip_path, "r") as archive:
              for info in archive.infolist():

                  name = info.filename.replace("\\", "/")

                  # Remove absolute path prefixes.
                  name = name.lstrip("/")

                  # Normalize path components.
                  parts = [
                      part
                      for part in name.split("/")
                      if part not in ("", ".")
                  ]

                  # Reject dangerous paths.
                  if any(part == ".." for part in parts):
                      raise RuntimeError(
                          f"Unsafe path in ZIP: {info.filename}"
                      )

                  if not parts:
                      continue

                  target = destination.joinpath(*parts)

                  # Ensure the final path stays inside project/.
                  try:
                      target.resolve().relative_to(destination)
                  except ValueError:
                      raise RuntimeError(
                          f"Unsafe extraction path: {info.filename}"
                      )

                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)

                      with archive.open(info, "r") as source:
                          with open(target, "wb") as output:
                              output.write(source.read())

          print("ZIP extracted successfully.")
          PY

          echo
          echo "Extracted project:"
          find project -maxdepth 4 -type f -print | sort


      # ============================================================
      # 5. FIND PACKAGE.JSON
      # ============================================================

      - name: Locate web project
        id: project
        shell: bash
        run: |
          set -e

          PACKAGE_JSON="$(find project \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/android/*' \
            | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            echo
            echo "Extracted files:"
            find project -maxdepth 6 -type f -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "package.json:"
          echo "$PACKAGE_JSON"

          echo
          echo "Web project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. SHOW PROJECT
      # ============================================================

      - name: Verify web project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Working directory:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 3 -type f \
            -not -path './node_modules/*' \
            -print | sort

          echo
          echo "package.json:"
          cat package.json


      # ============================================================
      # 7. SET UP NODE
      #
      # IMPORTANT:
      # No cache is used here because your previous workflow failed
      # with:
      #
      # "Some specified paths were not resolved, unable to cache
      # dependencies."
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 8. CHECK NODE
      # ============================================================

      - name: Check Node and npm
        shell: bash
        run: |
          set -e

          node --version
          npm --version


      # ============================================================
      # 9. SET UP JAVA 21
      #
      # Fixes:
      # "invalid source release: 21"
      # when the wrong JDK is being used.
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 10. CHECK JAVA
      # ============================================================

      - name: Check Java version
        shell: bash
        run: |
          set -e

          java -version
          javac -version


      # ============================================================
      # 11. INSTALL WEB DEPENDENCIES
      # ============================================================

      - name: Install web dependencies
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Installing dependencies..."

          if [ -f package-lock.json ]; then
            echo "package-lock.json found."
            npm ci
          else
            echo "No package-lock.json found."
            echo "Running npm install..."
            npm install
          fi


      # ============================================================
      # 12. CHECK CAPACITOR DEPENDENCIES
      # ============================================================

      - name: Check Capacitor
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Capacitor..."

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          console.log("Capacitor dependencies:");

          for (const name of [
            "@capacitor/core",
            "@capacitor/cli",
            "@capacitor/android"
          ]) {
            console.log(
              name,
              "=>",
              deps[name] || "NOT INSTALLED"
            );
          }
          NODE


      # ============================================================
      # 13. INSTALL CAPACITOR IF NECESSARY
      #
      # Capacitor 7 is used because the Android build shown in your
      # previous log is already compiling capacitor-android with
      # Java 21.
      # ============================================================

      - name: Install Capacitor
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          NEED_CAPACITOR="false"

          node <<'NODE' || NEED_CAPACITOR="true"
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = [
            "@capacitor/core",
            "@capacitor/cli",
            "@capacitor/android"
          ];

          for (const name of required) {
            if (!deps[name]) {
              console.error(`${name} is missing`);
              process.exit(1);
            }
          }

          console.log("All Capacitor packages are present.");
          NODE

          if [ "$NEED_CAPACITOR" = "true" ]; then
            echo "Installing Capacitor 7..."
            npm install \
              @capacitor/core@^7 \
              @capacitor/cli@^7 \
              @capacitor/android@^7
          fi

          npx cap --version


      # ============================================================
      # 14. BUILD WEB APPLICATION
      # ============================================================

      - name: Build web application
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          CI: "false"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building web application..."

          npm run build

          echo
          echo "Build completed."

          if [ -d build ]; then
            echo "CRA build directory detected:"
            ls -la build
          elif [ -d dist ]; then
            echo "Vite/dist build directory detected:"
            ls -la dist
          else
            echo "ERROR: Neither build/ nor dist/ was created."
            exit 1
          fi


      # ============================================================
      # 15. DETECT WEB DIRECTORY
      # ============================================================

      - name: Configure Capacitor web directory
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -d build ]; then
            WEB_DIR="build"
          elif [ -d dist ]; then
            WEB_DIR="dist"
          else
            echo "ERROR: No web build directory found."
            exit 1
          fi

          echo "Using web directory: $WEB_DIR"

          node <<NODE
          const fs = require("fs");

          const file = "capacitor.config.json";

          let config = {};

          if (fs.existsSync(file)) {
            config = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          }

          config.webDir = "$WEB_DIR";

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2) + "\\n"
          );

          console.log(
            "capacitor.config.json updated:"
          );

          console.log(
            fs.readFileSync(file, "utf8")
          );
          NODE


      # ============================================================
      # 16. CREATE CAPACITOR CONFIG IF MISSING
      # ============================================================

      - name: Ensure Capacitor configuration
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ]; then

            if [ -d build ]; then
              WEB_DIR="build"
            else
              WEB_DIR="dist"
            fi

            cat > capacitor.config.json <<EOF
          {
            "appId": "com.pixelkit.app",
            "appName": "PixelKit",
            "webDir": "$WEB_DIR",
            "bundledWebRuntime": false
          }
          EOF

            echo "Created capacitor.config.json:"
            cat capacitor.config.json
          fi


      # ============================================================
      # 17. CREATE ANDROID PROJECT IF MISSING
      # ============================================================

      - name: Create Android project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            echo "Android project does not exist."
            echo "Creating Android project..."

            npx cap add android
          else
            echo "Android project already exists."
          fi


      # ============================================================
      # 18. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor Android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android


      # ============================================================
      # 19. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew does not exist."
            find android -maxdepth 3 -type f -print | sort
            exit 1
          fi

          chmod +x android/gradlew

          echo
          echo "Android project verified."

          ls -la android


      # ============================================================
      # 20. CHECK GRADLE/JAVA
      # ============================================================

      - name: Check Gradle environment
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version


      # ============================================================
      # 21. CLEAN ANDROID PROJECT
      # ============================================================

      - name: Clean Android project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew clean


      # ============================================================
      # 22. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace


      # ============================================================
      # 23. FIND APK
      # ============================================================

      - name: Find APK
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK="$(find android \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."

            echo
            echo "Android build outputs:"
            find android \
              -type f \
              -path '*/build/outputs/*' \
              -print | sort

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$PROJECT_DIR/$APK" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 24. UPLOAD APK
      # ============================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error


      # ============================================================
      # 25. BUILD COMPLETE
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo "=========================================="
          echo " PIXELKIT ANDROID BUILD SUCCESSFUL"
          echo "=========================================="
          echo
          echo "The Debug APK has been uploaded as:"
          echo
          echo "PixelKit-debug-apk"
