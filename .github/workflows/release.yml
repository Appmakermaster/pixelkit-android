name: Build PixelKit Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Signed Release APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Node.js
      # =========================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # =========================================================
      # 3. Java
      # =========================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # =========================================================
      # 4. Find ZIP
      # =========================================================

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Project ZIP:"
          echo "$ZIP_FILE"


      # =========================================================
      # 5. Extract ZIP
      # =========================================================

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."


      # =========================================================
      # 6. Find package.json
      # =========================================================

      - name: Locate web project
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              | head -n 1
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"


      # =========================================================
      # 7. Install npm dependencies
      # =========================================================

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm install


      # =========================================================
      # 8. Install Capacitor
      # =========================================================

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android


      # =========================================================
      # 9. Build React application
      # =========================================================

      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          CI: "false"
        run: |
          set -euo pipefail

          npm run build


      # =========================================================
      # 10. Detect build directory
      # =========================================================

      - name: Detect web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "www" ]; then
            WEB_DIR="www"
          else
            echo "ERROR: No build directory found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "Web directory:"
          echo "$WEB_DIR"


      # =========================================================
      # 11. Create Capacitor config
      # =========================================================

      - name: Create Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}"
          }
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.json


      # =========================================================
      # 12. Create Android project
      # =========================================================

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android


      # =========================================================
      # 13. Sync Android
      # =========================================================

      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # =========================================================
      # 14. Decode signing keystore
      # =========================================================

      - name: Decode signing keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/pixelkit-release.jks

          if [ ! -s android/app/pixelkit-release.jks ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded."

          echo "Keystore size:"
          wc -c android/app/pixelkit-release.jks


      # =========================================================
      # 15. Verify PKCS12 keystore
      # =========================================================

      - name: Verify PKCS12 signing keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is empty."
            exit 1
          fi

          echo "Checking PKCS12 keystore..."

          keytool -list \
            -storetype PKCS12 \
            -keystore android/app/pixelkit-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "PKCS12 keystore verification successful."


      # =========================================================
      # 16. Create keystore.properties
      # =========================================================

      - name: Create Android signing properties
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is empty."
            exit 1
          fi

          cat > android/keystore.properties <<EOF
          storeFile=pixelkit-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Signing properties created."


      # =========================================================
      # 17. Configure Gradle signing
      # =========================================================

      - name: Configure Gradle release signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          loader = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  new FileInputStream(keystorePropertiesFile)
              )
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = loader + "\n" + text

          if "signingConfigs {" not in text:
              signing_config = r'''
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          '''

              if "android {" not in text:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              text = text.replace(
                  "android {",
                  "android {\n" + signing_config,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              release_config = r'''
                  release {
                      signingConfig signingConfigs.release
                  }
              '''

              if "buildTypes {" not in text:
                  raise SystemExit(
                      "ERROR: buildTypes block not found."
                  )

              text = text.replace(
                  "buildTypes {",
                  "buildTypes {\n" + release_config,
                  1
              )

          path.write_text(text)

          print("Gradle signing configuration ready.")
          PY


      # =========================================================
      # 18. Verify signing files
      # =========================================================

      - name: Verify Android signing files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/pixelkit-release.jks
          test -f android/keystore.properties
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Android signing files verified."


      # =========================================================
      # 19. Build signed release APK
      # =========================================================

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --stacktrace


      # =========================================================
      # 20. Find APK
      # =========================================================

      - name: Find release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "Release APK:"
          ls -lh "$APK"


      # =========================================================
      # 21. Upload APK
      # =========================================================

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-signed-release-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error


      # =========================================================
      # 22. Success
      # =========================================================

      - name: Build complete
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo " PIXELKIT SIGNED RELEASE APK SUCCESSFUL"
          echo "=========================================="
          echo
          echo "Artifact:"
          echo "PixelKit-signed-release-apk"
