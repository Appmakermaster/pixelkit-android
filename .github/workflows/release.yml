name: Build PixelKit Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Release APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"
      NODE_OPTIONS: "--openssl-legacy-provider"

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Node.js
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # =========================================================
      # 3. Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =========================================================
      # 4. Show repository
      # =========================================================
      - name: Show repository contents
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current directory:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 2 -type f -print | sort

      # =========================================================
      # 5. Find ZIP
      # =========================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo
          echo "Using ZIP:"
          echo "$ZIP_FILE"

      # =========================================================
      # 6. Extract ZIP
      # =========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo
          echo "Extracted project:"
          find project -maxdepth 3 -type f -print | sort

      # =========================================================
      # 7. Find package.json
      # =========================================================
      - name: Locate web project
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_JSON="$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo
          echo "package.json:"
          cat "$PACKAGE_JSON"

      # =========================================================
      # 8. Install web dependencies
      # =========================================================
      - name: Install web dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install

      # =========================================================
      # 9. Install Capacitor
      # =========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # =========================================================
      # 10. Check Node / npm / Capacitor
      # =========================================================
      - name: Check Node npm and Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Capacitor:"
          npx cap --version

          echo
          echo "Capacitor packages:"
          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --depth=0

      # =========================================================
      # 11. Build web application
      # =========================================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          CI: "false"
        run: |
          set -euxo pipefail

          npm run build

      # =========================================================
      # 12. Determine web directory
      # =========================================================
      - name: Determine web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "www" ]; then
            WEB_DIR="www"
          else
            echo "ERROR: No build directory found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo
          echo "Using web directory:"
          echo "$WEB_DIR"

      # =========================================================
      # 13. Create Capacitor configuration
      # =========================================================
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}"
          }
          EOF

          echo
          echo "Capacitor configuration:"
          cat capacitor.config.json

      # =========================================================
      # 14. Create Android project
      # =========================================================
      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            npx cap add android
          fi

      # =========================================================
      # 15. Sync Capacitor
      # =========================================================
      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npx cap sync android

      # =========================================================
      # 16. Verify Android project
      # =========================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          echo "Android project created successfully."

      # =========================================================
      # 17. Gradle environment
      # =========================================================
      - name: Check Gradle environment
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          java -version

          ./gradlew --version

      # =========================================================
      # 18. Clean Android project
      # =========================================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew clean

      # =========================================================
      # 19. Build RELEASE APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace

      # =========================================================
      # 20. Find RELEASE APK
      # =========================================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for release APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/release/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Release APK found:"
          echo "$APK"

      # =========================================================
      # 21. Upload RELEASE APK
      # =========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-release-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error

      # =========================================================
      # 22. Complete
      # =========================================================
      - name: Build complete
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "   PIXELKIT RELEASE APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo
          echo "Artifact:"
          echo "PixelKit-release-apk"
