name: Build PixelKit Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Release APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"
      NODE_OPTIONS: "--openssl-legacy-provider"

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Node.js
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # =========================================================
      # 3. Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =========================================================
      # 4. Show repository
      # =========================================================
      - name: Show repository contents
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current directory:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 2 -type f -print | sort

      # =========================================================
      # 5. Find ZIP
      # =========================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo
          echo "Using ZIP:"
          echo "$ZIP_FILE"

      # =========================================================
      # 6. Extract ZIP
      # =========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo
          echo "Extracted project:"
          find project -maxdepth 3 -type f -print | sort

      # =========================================================
      # 7. Find package.json
      # =========================================================
      - name: Locate web project
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_JSON="$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo
          echo "package.json:"
          cat "$PACKAGE_JSON"

      # =========================================================
      # 8. Install web dependencies
      # =========================================================
      - name: Install web dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install

      # =========================================================
      # 9. Install Capacitor
      # =========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # =========================================================
      # 10. Check Node / npm / Capacitor
      # =========================================================
      - name: Check Node npm and Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Capacitor:"
          npx cap --version

          echo
          echo "Capacitor packages:"
          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --depth=0

      # =========================================================
      # 11. Build web application
      # =========================================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          CI: "false"
        run: |
          set -euxo pipefail

          npm run build

      # =========================================================
      # 12. Determine web directory
      # =========================================================
      - name: Determine web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "www" ]; then
            WEB_DIR="www"
          else
            echo "ERROR: No build directory found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo
          echo "Using web directory:"
          echo "$WEB_DIR"

      # =========================================================
      # 13. Create Capacitor configuration
      # =========================================================
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}"
          }
          EOF

          echo
          echo "Capacitor configuration:"
          cat capacitor.config.json

      # =========================================================
      # 14. Create Android project
      # =========================================================
      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            npx cap add android
          fi

      # =========================================================
      # 15. Sync Capacitor
      # =========================================================
      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          npx cap sync android

      # =========================================================
      # 16. Verify Android project
      # =========================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          echo "Android project created successfully."

      # =========================================================
      # 17. Gradle environment
      # =========================================================
      - name: Check Gradle environment
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          java -version

          ./gradlew --version

      # =========================================================
      # 18. Clean Android project
      # =========================================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew clean

      # =========================================================
      # 19. Prepare signing keystore
      # =========================================================
      - name: Prepare signing keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > pixelkit-release.jks

          if [ ! -s pixelkit-release.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Signing keystore prepared successfully."

      # =========================================================
      # 20. Create Android signing properties
      # =========================================================
      - name: Create Android signing properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          cat > android/keystore.properties <<EOF
          storeFile=../pixelkit-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Signing properties created."

      # =========================================================
      # 21. Configure Gradle signing
      # =========================================================
      - name: Configure Gradle signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="android/app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: android/app/build.gradle was not found."
            echo
            echo "Android project files:"
            find android/app -maxdepth 2 -type f -print | sort
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_loader = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = signing_loader + "\n" + text

          if "signingConfigs {" not in text:
              signing_block = r'''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties["storeFile"])
                          storePassword keystoreProperties["storePassword"]
                          keyAlias keystoreProperties["keyAlias"]
                          keyPassword keystoreProperties["keyPassword"]
                      }
                  }
              }
          '''

              text = text.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
          """,
                  1
              )

          path.write_text(text)
          PY

          echo "Gradle signing configuration added."

      # =========================================================
      # 22. Verify signing configuration
      # =========================================================
      - name: Verify signing configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f pixelkit-release.jks
          test -f android/keystore.properties
          test -f android/app/build.gradle

          echo "Signing files are present."

      # =========================================================
      # 23. Build SIGNED RELEASE APK
      # =========================================================
      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace

      # =========================================================
      # 24. Find RELEASE APK
      # =========================================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for release APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/release/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Release APK found:"
          echo "$APK"

      # =========================================================
      # 25. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$APK"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file not found."
            exit 1
          fi

          echo "APK:"
          echo "$APK_FILE"

          echo
          echo "Checking APK with apksigner..."

          APKSIGNER="$(find "$ANDROID_HOME" \
            -type f \
            -name apksigner \
            | head -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "WARNING: apksigner was not found."
            echo "Skipping signature verification."
          else
            "$APKSIGNER" verify --verbose "$APK_FILE"
          fi

      # =========================================================
      # 26. Upload SIGNED RELEASE APK
      # =========================================================
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-signed-release-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error

      # =========================================================
      # 27. Complete
      # =========================================================
      - name: Build complete
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo " PIXELKIT SIGNED RELEASE APK SUCCESSFUL"
          echo "=========================================="
          echo
          echo "Artifact:"
          echo "PixelKit-signed-release-apk"
