name: Build PixelKit Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Signed Release APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"
      NODE_OPTIONS: "--openssl-legacy-provider"

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Node.js
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # =========================================================
      # 3. Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =========================================================
      # 4. Show repository
      # =========================================================
      - name: Show repository contents
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          find . -maxdepth 2 -type f -print | sort

      # =========================================================
      # 5. Find ZIP
      # =========================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP_FILE"

      # =========================================================
      # 6. Extract ZIP
      # =========================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."

      # =========================================================
      # 7. Locate package.json
      # =========================================================
      - name: Locate web project
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              | head -n 1
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo
          echo "package.json:"
          cat "$PACKAGE_JSON"

      # =========================================================
      # 8. Install web dependencies
      # =========================================================
      - name: Install web dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm install

      # =========================================================
      # 9. Install Capacitor
      # =========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # =========================================================
      # 10. Check tools
      # =========================================================
      - name: Check tools
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Capacitor:"
          npx cap --version

      # =========================================================
      # 11. Build React application
      # =========================================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          CI: "false"
        run: |
          set -euo pipefail

          npm run build

      # =========================================================
      # 12. Determine web directory
      # =========================================================
      - name: Determine web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "www" ]; then
            WEB_DIR="www"
          else
            echo "ERROR: build/dist/www directory not found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "Web directory:"
          echo "$WEB_DIR"

      # =========================================================
      # 13. Create Capacitor configuration
      # =========================================================
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}"
          }
          EOF

          cat capacitor.config.json

      # =========================================================
      # 14. Create Android project
      # =========================================================
      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            npx cap add android
          fi

      # =========================================================
      # 15. Sync Android
      # =========================================================
      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      # =========================================================
      # 16. Verify Android project
      # =========================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project verified."

      # =========================================================
      # 17. Prepare signing keystore
      # =========================================================
      - name: Prepare signing keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > pixelkit-release.jks

          test -s pixelkit-release.jks

          echo "Keystore created successfully."

      # =========================================================
      # 18. Configure Android signing
      # =========================================================
      - name: Configure Android signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          KEYSTORE_PATH="$GITHUB_WORKSPACE/$(
            python3 -c 'import os; print(os.environ["PROJECT_DIR"].replace(os.environ["GITHUB_WORKSPACE"] + "/", ""))'
          )/pixelkit-release.jks"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          test -s android/keystore.properties

          echo "Android signing properties created."

      # =========================================================
      # 19. Add signing configuration to Gradle
      # =========================================================
      - name: Configure Gradle signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="android/app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle file not found:"
            echo "$GRADLE_FILE"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          loader = '''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = loader + "\n" + text

          if "signingConfigs {" not in text:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
              '''

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              release_signing = '''
                  release {
                      signingConfig signingConfigs.release
                  }
              '''

              if "buildTypes {" in text:
                  text = text.replace(
                      "buildTypes {",
                      "buildTypes {\n" + release_signing,
                      1
                  )
              else:
                  text += "\nandroid {\n    buildTypes {\n" + release_signing + "    }\n}\n"

          path.write_text(text)

          print("Gradle signing configuration written.")
          PY

      # =========================================================
      # 20. Verify signing files
      # =========================================================
      - name: Verify signing setup
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking keystore..."

          test -f pixelkit-release.jks
          test -s pixelkit-release.jks

          echo "Checking signing properties..."

          test -f android/keystore.properties
          test -s android/keystore.properties

          echo "Checking Gradle..."

          test -f android/app/build.gradle

          echo "Signing setup is ready."

      # =========================================================
      # 21. Gradle environment
      # =========================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # =========================================================
      # 22. Clean
      # =========================================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

      # =========================================================
      # 23. Build signed RELEASE APK
      # =========================================================
      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace

      # =========================================================
      # 24. Find APK
      # =========================================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/release/*" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "Release APK:"
          echo "$APK"

      # =========================================================
      # 25. Verify APK
      # =========================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      # =========================================================
      # 26. Upload APK
      # =========================================================
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-signed-release-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error

      # =========================================================
      # 27. Complete
      # =========================================================
      - name: Build complete
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo " PIXELKIT SIGNED RELEASE APK SUCCESSFUL"
          echo "=========================================="
          echo
          echo "Artifact:"
          echo "PixelKit-signed-release-apk"
