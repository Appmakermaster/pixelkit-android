name: Build PixelKit Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Signed Release APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # -------------------------------------------------------
      # Find ZIP
      # -------------------------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

      # -------------------------------------------------------
      # Extract project
      # -------------------------------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."

      # -------------------------------------------------------
      # Find package.json
      # -------------------------------------------------------
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              | head -n 1
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm install

      # -------------------------------------------------------
      # Install Capacitor
      # -------------------------------------------------------
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # -------------------------------------------------------
      # Build React
      # -------------------------------------------------------
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          CI: "false"
        run: |
          set -euo pipefail
          npm run build

      # -------------------------------------------------------
      # Detect web directory
      # -------------------------------------------------------
      - name: Detect web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "www" ]; then
            WEB_DIR="www"
          else
            echo "ERROR: build/dist/www was not found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "Web directory: $WEB_DIR"

      # -------------------------------------------------------
      # Capacitor config
      # -------------------------------------------------------
      - name: Create Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}"
          }
          EOF

          cat capacitor.config.json

      # -------------------------------------------------------
      # Android
      # -------------------------------------------------------
      - name: Add Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android

      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      # -------------------------------------------------------
      # Decode signing keystore
      # -------------------------------------------------------
      - name: Decode signing keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/pixelkit-release.jks

          if [ ! -s android/app/pixelkit-release.jks ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded successfully."

      # -------------------------------------------------------
      # VERIFY KEYSTORE BEFORE BUILD
      # -------------------------------------------------------
      - name: Verify signing keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          echo "Checking keystore format..."

          keytool -list \
            -keystore android/app/pixelkit-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keystore-check.txt

          echo "Keystore verification successful."

      # -------------------------------------------------------
      # Get key alias automatically from keystore
      # -------------------------------------------------------
      - name: Verify key alias
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          keytool -list \
            -keystore android/app/pixelkit-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/key-check.txt

          echo "Key alias verification successful."

      # -------------------------------------------------------
      #
