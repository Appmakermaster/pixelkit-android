name: Build PixelKit Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelKit Signed Release APK
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      APP_ID: "com.appmakermaster.pixelkit"
      APP_NAME: "PixelKit"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ---------------------------------------------------------
      # Find and extract your CodeSandbox ZIP
      # ---------------------------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."

      # ---------------------------------------------------------
      # Find package.json
      # ---------------------------------------------------------
      - name: Find React project
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              | head -n 1
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "React project:"
          echo "$PROJECT_DIR"

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm install

      # ---------------------------------------------------------
      # Install Capacitor
      # ---------------------------------------------------------
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # ---------------------------------------------------------
      # Build React
      # ---------------------------------------------------------
      - name: Build React application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          CI: "false"
        run: |
          set -euo pipefail
          npm run build

      # ---------------------------------------------------------
      # Find build directory
      # ---------------------------------------------------------
      - name: Find web build directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "build" ]; then
            echo "WEB_DIR=build" >> "$GITHUB_ENV"
          elif [ -d "dist" ]; then
            echo "WEB_DIR=dist" >> "$GITHUB_ENV"
          elif [ -d "www" ]; then
            echo "WEB_DIR=www" >> "$GITHUB_ENV"
          else
            echo "ERROR: No build directory found."
            exit 1
          fi

      # ---------------------------------------------------------
      # Capacitor configuration
      # ---------------------------------------------------------
      - name: Create Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}"
          }
          EOF

      # ---------------------------------------------------------
      # Create Android project
      # ---------------------------------------------------------
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android

      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      # ---------------------------------------------------------
      # CREATE KEYSTORE
      #
      # The keystore is deliberately placed INSIDE android/app.
      # This avoids the path problem from your previous build.
      # ---------------------------------------------------------
      - name: Create release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/pixelkit-release.jks

          if [ ! -s android/app/pixelkit-release.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore created."

      # ---------------------------------------------------------
      # CREATE SIGNING PROPERTIES
      # ---------------------------------------------------------
      - name: Create signing properties
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is empty."
            exit 1
          fi

          cat > android/keystore.properties <<EOF
          storeFile=pixelkit-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Signing properties created."

      # ---------------------------------------------------------
      # CONFIGURE GRADLE
      # ---------------------------------------------------------
      - name: Configure Android signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")

          text = gradle.read_text()

          signing_loader = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = signing_loader + "\n" + text

          signing_block = r'''
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {\n" + signing_block,
                  1
              )

          release_block = r'''
                  release {
                      signingConfig signingConfigs.release
                  }
          '''

          if "signingConfig signingConfigs.release" not in text:
              if "buildTypes {" in text:
                  text = text.replace(
                      "buildTypes {",
                      "buildTypes {\n" + release_block,
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: buildTypes block not found in android/app/build.gradle"
                  )

          gradle.write_text(text)

          print("Android signing configuration added.")
          PY

      # ---------------------------------------------------------
      # VERIFY SIGNING FILES
      # ---------------------------------------------------------
      - name: Verify signing configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking keystore..."
          test -f android/app/pixelkit-release.jks

          echo "Checking signing properties..."
          test -f android/keystore.properties

          echo "Checking Gradle..."
          test -f android/app/build.gradle

          echo "Signing configuration is ready."

      # ---------------------------------------------------------
      # Build RELEASE APK
      # ---------------------------------------------------------
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --stacktrace

      # ---------------------------------------------------------
      # Find APK
      # ---------------------------------------------------------
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK generated:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload PixelKit APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-signed-release-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK }}
          if-no-files-found: error

      # ---------------------------------------------------------
      # DONE
      # ---------------------------------------------------------
      - name: Success
        shell: bash
        run: |
          echo "========================================"
          echo " PIXELKIT RELEASE APK SUCCESSFUL"
          echo "========================================"
